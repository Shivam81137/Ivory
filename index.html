<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ivory - Premium Music</title>
    <link rel="stylesheet" href="style.css?v=5.0" />
    <link rel="stylesheet" href="mobile.css?v=5.0" media="(max-width: 768px)" />
  </head>

  <body class="intro-mode">
    <div id="canvas-container"></div>
    <div id="ambient-glow"></div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="app-layout">
      <aside class="sidebar glass-panel">
        <div class="logo-area">
          <img src="IMAGES/logoo.png" alt="Ivory Logo" class="brand-logo" />
        </div>

        <div class="lyrics-label">Now Playing</div>

        <div class="lyrics-scroll-wrapper">
          <div id="sidebar-lyrics" class="lyrics-container">
            <p class="lyrics-placeholder">PLAY A SONG TO GET LYRICS...</p>
          </div>
        </div>
      </aside>

      <main class="main-view">
        <header class="top-header">
          <div class="nav-controls">
            <button
              class="circle-btn mobile-menu-btn"
              id="mobile-menu-toggle"
              style="display: none"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                width="20"
                height="20"
              >
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <button class="circle-btn" id="global-back-btn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="22"
                height="22"
                style="margin-right: 2px"
              >
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
          </div>

          <div class="search-container">
            <svg
              class="search-icon-input"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="song-search"
              placeholder="What do you want to play?"
            />
            <div id="search-results" class="search-dropdown"></div>
          </div>

          <div class="welcome-section">
            <h1 class="brand-title">WELCOME TO IVORY</h1>
          </div>
        </header>

        <div class="content-body">
          <div class="filter-bar">
            <button class="pill active" id="pill-all" onclick="showAll(this)">
              All
            </button>
            <button class="pill" id="pill-artists" onclick="showArtists(this)">
              Artists
            </button>
          </div>

          <!-- Sections injected dynamically by renderHome() -->
        </div>
      </main>
    </div>

    <!-- Music Player Bar -->
    <footer class="music-player">

      <!-- Progress bar strip (top of bar on mobile) -->
      <div class="mobile-progress-strip">
        <div class="playback-bar">
          <span class="time current" id="sb-current">0:00</span>
          <input
            type="range"
            class="progress-bar-range"
            id="sb-progress"
            value="0"
            min="0"
            max="100"
            step="0.1"
          />
          <span class="time total" id="sb-duration">0:00</span>
        </div>
      </div>

      <!-- Song Info: art + title + like -->
      <div class="song-info">
        <img
          src="IMAGES/logoo.png"
          alt="Album Art"
          class="player-art"
          id="sb-art"
        />
        <div class="song-text">
          <h4 class="song-title" id="sb-title">---</h4>
          <p class="song-artist" id="sb-artist">---</p>
        </div>
        <button class="icon-btn like-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
      </div>

      <!-- Controls: shuffle + prev + play + next + repeat -->
      <div class="player-controls">
        <div class="control-buttons">
          <button class="icon-btn shuffle-btn" id="sb-shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span class="btn-label">Shuffle</span>
          </button>
          <button class="icon-btn prev-btn" id="sb-prev">
            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line>
            </svg>
          </button>
          <button class="play-btn-main" id="sb-play">
            <svg class="play-icon-svg" viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
          <button class="icon-btn next-btn" id="sb-next">
            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
            </svg>
          </button>
          <button class="icon-btn repeat-btn" id="sb-repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            <span class="btn-label">Repeat</span>
          </button>
        </div>

        <!-- Desktop progress bar (hidden on mobile, replaced by mobile-progress-strip) -->
        <div class="playback-bar desktop-playback-bar">
          <span class="time current" id="sb-current-d">0:00</span>
          <input type="range" class="progress-bar-range" id="sb-progress-d"
                 value="0" min="0" max="100" step="0.1" />
          <span class="time total" id="sb-duration-d">0:00</span>
        </div>
      </div>

      <!-- Volume / extras (hidden on mobile) -->
      <div class="volume-controls">
        <button class="icon-btn lyrics-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <button class="icon-btn queue-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
        <button class="icon-btn device-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
        </button>
        <button class="icon-btn expand-btn" id="expand-btn" title="Full Screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
        <div class="volume-slider-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <input type="range" class="vol-slider-range" id="sb-volume" value="0.8" min="0" max="1" step="0.01" />
        </div>
      </div>
    </footer>

    <!-- Full Screen Overlay -->
    <div id="fullscreen-overlay">
      <div id="fs-video-bg-container"></div>
      <div class="fs-background" id="fs-bg"></div>
      <button class="fs-close-btn" id="fs-close">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          width="32"
          height="32"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="fs-content">
        <div class="fs-left">
          <img
            src="IMAGES/logoo.png"
            alt="Album Art"
            class="fs-art"
            id="fs-art"
          />
          <div class="fs-info">
            <h2 id="fs-title">---</h2>
            <p id="fs-artist">---</p>
          </div>

          <div class="fs-player-bar">
            <div class="fs-progress-container">
              <span id="fs-current-time">0:00</span>
              <input
                type="range"
                class="fs-progress-range"
                id="fs-progress"
                value="0"
                min="0"
                max="100"
                step="0.1"
              />
              <span id="fs-duration">0:00</span>
            </div>

            <div class="fs-controls">
              <button class="icon-btn fs-btn" id="fs-prev">
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="32"
                  height="32"
                >
                  <polygon points="19 20 9 12 19 4 19 20"></polygon>
                  <line
                    x1="5"
                    y1="19"
                    x2="5"
                    y2="5"
                    stroke="currentColor"
                    stroke-width="2"
                  ></line>
                </svg>
              </button>
              <button class="play-btn-main fs-play-btn" id="fs-play">
                <svg
                  class="play-icon-svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="40"
                  height="40"
                >
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </button>
              <button class="icon-btn fs-btn" id="fs-next">
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="32"
                  height="32"
                >
                  <polygon points="5 4 15 12 5 20 5 4"></polygon>
                  <line
                    x1="19"
                    y1="5"
                    x2="19"
                    y2="19"
                    stroke="currentColor"
                    stroke-width="2"
                  ></line>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="fs-right">
          <div id="fullscreen-lyrics" class="fs-lyrics-container">
            <p class="lyrics-placeholder">Lyrics will appear here...</p>
          </div>
        </div>
      </div>
    </div>

    <script async src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script async src="https://unpkg.com/butterchurn@2.6.0/lib/butterchurn.min.js"></script>
    <script async src="https://unpkg.com/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>
    <!-- YouTube IFrame API loaded on-demand by script.js when needed -->
    <!-- ═══════════════════════════════════════════════ -->
    <!-- IVORY STREAMING CONFIG - Global Music Discovery -->
    <!-- ═══════════════════════════════════════════════ -->
    <script src="STREAMING_CONFIG.js"></script>
    <!-- Main Player with Global Search & Streaming -->
    <script defer src="script.js?v=5.0"></script>
  </body>
</html>
