<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .petal-group {
        transform-origin: 50px 50px;
        animation: spin 25s linear infinite;
      }
      .center-heart {
        fill: #ff2a5f;
        transform-origin: 50px 50px;
        animation: heartbeat 1.4s ease-in-out infinite;
        filter: drop-shadow(0 0 3px rgba(255, 42, 95, 0.6));
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.15); }
        40% { transform: scale(1.05); }
        55% { transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Sunflower Petals (Rotating Group) -->
  <g class="petal-group">
    <!-- Outer Golden Petals -->
    <g fill="#FFD700">
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(30 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(60 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(90 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(120 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(150 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(180 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(210 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(240 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(270 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(300 50 50)" />
      <path d="M50 50 Q58 25 50 5 Q42 25 50 50 Z" transform="rotate(330 50 50)" />
    </g>

    <!-- Inner Orange/Amber Petals (Layered & Rotated) -->
    <g fill="#FF8C00" opacity="0.85">
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(15 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(45 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(75 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(105 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(135 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(165 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(195 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(225 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(255 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(285 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(315 50 50)" />
      <path d="M50 50 Q56 28 50 10 Q44 28 50 50 Z" transform="rotate(345 50 50)" />
    </g>
  </g>

  <!-- Center Brown Disk -->
  <circle cx="50" cy="50" r="18" fill="#4A2F13" stroke="#2E1B07" stroke-width="1.5" />

  <!-- Pulsing Heart in the Center -->
  <path class="center-heart" d="M50 38 C45 33, 37 38, 40 47 C44 54, 50 62, 50 62 C50 62, 56 54, 60 47 C63 38, 55 33, 50 38 Z" />
</svg>
